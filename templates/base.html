<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Tracker{% endblock %} - Job Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% set ep = request.endpoint or '' %}
  <header>
    <a class="brand" href="{{ url_for('main.index') }}">Job Tracker</a>
    <a href="{{ url_for('companies.list_companies') }}" class="{{ 'active' if ep.startswith('companies.') }}">Companies</a>
    <a href="{{ url_for('jobs.list_jobs') }}" class="{{ 'active' if ep.startswith('jobs.') }}">Jobs</a>
    <a href="{{ url_for('applications.list_applications') }}" class="{{ 'active' if ep.startswith('applications.') }}">Applications</a>
    <a href="{{ url_for('contacts.list_contacts') }}" class="{{ 'active' if ep.startswith('contacts.') }}">Contacts</a>
    <a href="{{ url_for('match.index') }}" class="{{ 'active' if ep.startswith('match.') }}">Job Match</a>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script>
    // Ask before deleting (forms marked data-confirm)
    document.addEventListener('submit', function (e) {
      var msg = e.target.getAttribute('data-confirm');
      if (msg && !confirm(msg)) e.preventDefault();
    });
  </script>
</body>
</html>
